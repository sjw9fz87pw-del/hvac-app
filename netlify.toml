[build]
  # `base` and `publish` are both explicit because framework detection picks the
  # wrong directory here: packages/nfc-core has its own package.json, so Netlify
  # treats that workspace package as the app and looks for the build output at
  # packages/nfc-core/.next, which never exists.
  base = "."
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Prisma's postinstall generates the client; the build script regenerates it
  # after install so the Lambda-compatible engine is present in the bundle.
  PRISMA_HIDE_UPDATE_MESSAGE = "true"

# Required: auto-detection does not apply the Next.js runtime to upload-based
# deploys, and without it every route is served as a static file and 404s.
# Netlify installs this itself, so it is deliberately not a devDependency.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"

# Photos are served through the app so they stay behind authentication; make sure
# nothing caches them at the edge across users.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"
