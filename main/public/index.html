<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HVAC app</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; line-height: 1.6;
         max-width: 32rem; margin: 0 auto; padding: 3rem 1.25rem; }
  h1 { font-size: 1.25rem; font-weight: 500; margin: 0 0 1.5rem; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .5rem 1.5rem; margin: 0; }
  dt { opacity: .7; }
  dd { margin: 0; font-family: ui-monospace, monospace; font-size: .875rem; }
</style>
</head>
<body>
  <h1>Pipeline is live</h1>
  <dl>
    <dt>Status</dt><dd id="status">checking…</dd>
    <dt>Context</dt><dd id="context">—</dd>
    <dt>Site</dt><dd id="site">—</dd>
    <dt>Deploy</dt><dd id="deployId">—</dd>
  </dl>
<script>
  const set = (id, v) => { document.getElementById(id).textContent = v; };
  fetch("/api/health", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error("status " + r.status); return r.json(); })
    .then((d) => {
      set("status", "ok");
      set("context", d.context);
      set("site", d.site);
      set("deployId", d.deployId);
    })
    .catch((e) => set("status", "unreachable — " + e.message));
</script>
</body>
</html>
